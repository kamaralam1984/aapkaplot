name: Deploy to VPS

on:
  push:
    branches: [main]
    # Skip deploys for changes that don't affect the runtime
    paths-ignore:
      - "**.md"
      - "PROJECT_AUDIT.md"
      - "DEPLOY.md"
      - ".gitignore"
  workflow_dispatch:        # manual trigger from the Actions tab

concurrency:
  group: deploy-vps
  cancel-in-progress: false # let an in-flight deploy finish before the next

jobs:
  deploy:
    name: SSH → /var/www/aapkaplot
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Run setup script on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     22
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/aapkaplot
            echo "── Triggered by: ${{ github.actor }} on commit ${{ github.sha }}"
            git fetch --depth=20 origin main
            git reset --hard origin/main
            bash deploy/vps-setup.sh

      - name: Smoke test
        run: |
          set -e
          for url in https://8rupiya.in/ https://www.8rupiya.in/; do
            code=$(curl -sIo /dev/null -w "%{http_code}" --max-time 15 "$url" || echo 000)
            echo "  $url → HTTP $code"
            [ "$code" = "200" ] || [ "$code" = "307" ] || exit 1
          done
          echo "✓ Both domains healthy"
