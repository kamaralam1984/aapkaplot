name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "PROJECT_AUDIT.md"
      - "DEPLOY.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Webhook → aapkaplot.com
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Trigger deploy webhook on VPS
        env:
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          set -e
          echo "── Triggered by: ${{ github.actor }} on commit ${{ github.sha }}"
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST https://aapkaplot.com/api/deploy/pull \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
            --max-time 30)
          echo "Webhook status: $STATUS"
          cat /tmp/resp.json
          echo
          [ "$STATUS" = "202" ] || (echo "❌ Webhook rejected"; exit 1)

      - name: Wait for deploy to finish
        run: |
          set -e
          echo "── Polling /about to return 200 (max 4 min)…"
          deadline=$(( $(date +%s) + 240 ))
          while [ $(date +%s) -lt $deadline ]; do
            sleep 10
            code=$(curl -sIo /dev/null -w "%{http_code}" --max-time 10 "https://aapkaplot.com/about?v=${{ github.sha }}")
            echo "  /about → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✓ Deploy live"
              exit 0
            fi
          done
          echo "❌ Timed out waiting for /about to return 200"
          exit 1

      - name: Smoke test new pages
        run: |
          set -e
          fail=0
          for url in / /about /contact /careers /press /ai-technology /help /blog /privacy /terms /cookies /sitemap; do
            code=$(curl -sIo /dev/null -w "%{http_code}" --max-time 15 "https://aapkaplot.com$url")
            echo "  $url → HTTP $code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = "0" ] && echo "✓ All routes healthy" || (echo "❌ Some routes failed"; exit 1)
